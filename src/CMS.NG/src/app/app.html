<div class="layout" [class.layout-slim]="sidebarCollapsed()">
  <!-- Sidebar (Ultima style) -->
  <aside class="layout-sidebar">
    <div class="sidebar-logo">
      <i class="pi pi-box logo-mark"></i>
      <span class="logo-text">{{ title() }}</span>
      <button
        type="button"
        class="slim-toggle"
        (click)="toggleSidebar()"
        aria-label="toggle sidebar"
      >
        <i class="pi" [class.pi-angle-left]="!sidebarCollapsed()" [class.pi-angle-right]="sidebarCollapsed()"></i>
      </button>
    </div>

    <nav class="layout-menu">
      @for (section of menu(); track section.title) {
        <div class="menu-section">
          <div class="menu-section-title">{{ section.title }}</div>
          @for (item of section.items; track item.label) {
            @if (item.route) {
              <a
                class="menu-item"
                [routerLink]="item.route"
                routerLinkActive="active-route"
                [title]="item.label"
              >
                <i class="menu-item-icon" [class]="item.icon"></i>
                <span class="menu-item-text">{{ item.label }}</span>
              </a>
            } @else {
              <span class="menu-item disabled" [title]="item.label">
                <i class="menu-item-icon" [class]="item.icon"></i>
                <span class="menu-item-text">{{ item.label }}</span>
              </span>
            }
          }
        </div>
      }
    </nav>
  </aside>

  <!-- Content -->
  <main class="layout-content">
    <router-outlet />
  </main>
</div>

<p-toast position="top-right" />
<p-confirmdialog />
