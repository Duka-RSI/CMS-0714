<div class="page">
  <!-- Header -->
  <div class="page-header">
    <div class="title-block">
      <h1 class="title">角色 AppRole</h1>
      <span class="subtitle">使用者角色</span>
    </div>
    <div class="actions">
      <p-button
        label="搜尋條件"
        [icon]="isFiltered() ? 'pi pi-filter-fill' : 'pi pi-filter'"
        [severity]="isFiltered() ? 'info' : 'secondary'"
        [outlined]="!isFiltered()"
        [badge]="isFiltered() ? activeFilterCount().toString() : undefined"
        badgeSeverity="contrast"
        (onClick)="openFilter()"
      />
      <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="goAdd()" />
    </div>
  </div>

  <!-- Filtered indicator -->
  @if (isFiltered()) {
    <div class="filter-banner">
      <i class="pi pi-filter-fill"></i>
      <span class="filter-banner-label">已套用篩選條件：</span>
      <span class="chips">
        @for (chip of appliedFilters(); track chip.label) {
          <span class="chip">{{ chip.label }}：<b>{{ chip.value }}</b></span>
        }
      </span>
      <p-button
        label="清除篩選"
        icon="pi pi-times"
        severity="secondary"
        [text]="true"
        size="small"
        (onClick)="clearFilter()"
      />
    </div>
  }

  <!-- Table -->
  <div class="card"
    [class.card-filtered]="isFiltered()">
    <p-table
      [value]="roles()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="rows"
      [(first)]="first"
      [rowsPerPageOptions]="[10, 20, 50]"
      [sortField]="sortField"
      [sortOrder]="sortOrder"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
      dataKey="roleId"
      (onSort)="onSort($event)"
      (onPage)="onPage($event)"
      styleClass="p-datatable-sm p-datatable-gridlines"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
          <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
          <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
          <th pSortableColumn="permissionLevel" style="width: 9rem">
            權限等級 <p-sortIcon field="permissionLevel" />
          </th>
          <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
          <th pSortableColumn="userCount" style="width: 8rem">
            使用者數 <p-sortIcon field="userCount" />
          </th>
          <th style="width: 9rem" class="text-center">操作</th>
        </tr>
      </ng-template>

      <ng-template #body let-role>
        <tr>
          <td>{{ role.pkid }}</td>
          <td>
            <a class="link" (click)="goView(role)">{{ role.roleId }}</a>
          </td>
          <td>{{ role.roleName }}</td>
          <td>{{ role.permissionLevel }}</td>
          <td>{{ role.description }}</td>
          <td>{{ role.userCount }}</td>
          <td class="text-center">
            <p-button
              icon="pi pi-eye"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              pTooltip="檢視"
              (onClick)="goView(role)"
            />
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [text]="true"
              [rounded]="true"
              pTooltip="編輯"
              (onClick)="goEdit(role)"
            />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              [rounded]="true"
              pTooltip="刪除"
              (onClick)="confirmDelete(role)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="7" class="text-center empty">查無資料</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Filter drawer -->
<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="field">
      <label for="keyword">關鍵字</label>
      <input
        id="keyword"
        type="text"
        pInputText
        [(ngModel)]="filters.keyword"
        placeholder="角色代碼 / 角色名稱 / 描述"
        (keyup.enter)="applyFilter()"
      />
    </div>
    <div class="field">
      <label for="permissionLevel">權限等級</label>
      <p-inputNumber
        inputId="permissionLevel"
        [(ngModel)]="filters.permissionLevel"
        [useGrouping]="false"
        placeholder="不限"
      />
    </div>
  </div>
  <ng-template #footer>
    <div class="filter-footer">
      <p-button label="清除" severity="secondary" [outlined]="true" (onClick)="clearFilter()" />
      <p-button label="套用" icon="pi pi-search" (onClick)="applyFilter()" />
    </div>
  </ng-template>
</p-drawer>
