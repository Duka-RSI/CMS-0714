<div class="page">
  <div class="page-header">
    <h1 class="title">檢視合作廠商</h1>
    <div class="actions">
      <app-row-audit-badge tableName="Partner" [pkid]="partner()?.pkid ?? 0" />
      <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" (onClick)="goBack()" />
      <p-button label="編輯" icon="pi pi-pencil" (onClick)="goEdit()" />
    </div>
  </div>

  @if (partner(); as p) {
    <div class="card">
      <h2 class="section-title">合作廠商資料</h2>
      <dl class="detail-grid">
        <dt>主代碼</dt>
        <dd>{{ p.pkid }}</dd>

        <dt>名稱</dt>
        <dd>{{ p.name }}</dd>

        <dt>關鍵字</dt>
        <dd>{{ p.appKey }}</dd>

        <dt>廠商選單顯示名稱</dt>
        <dd>{{ p.nameOnPartnerMenu }}</dd>

        <dt>課程詳細頁顯示名稱</dt>
        <dd>{{ p.nameOnCourseDetailPage }}</dd>

        <dt>顯示順序</dt>
        <dd>{{ p.displayOrder }}</dd>

        <dt>圖片檔名</dt>
        <dd>{{ p.imageFilename || '—' }}</dd>
      </dl>
    </div>
  } @else if (!loading()) {
    <div class="card empty">查無資料。</div>
  }
</div>
