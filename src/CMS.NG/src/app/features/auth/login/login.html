<div class="login-page">
  <form [formGroup]="form" (ngSubmit)="submit()" class="login-card" novalidate>
    <div class="login-brand">
      <i class="pi pi-box logo-mark"></i>
      <span class="logo-text">UWA</span>
    </div>

    <h1 class="login-title">登入</h1>
    <p class="login-subtitle">請輸入您的使用者代碼與密碼。</p>

    @if (errorMessage()) {
      <p-message severity="error" [text]="errorMessage()" styleClass="login-error" />
    }

    <div class="field">
      <label for="userId">使用者代碼</label>
      <input
        id="userId"
        type="text"
        pInputText
        formControlName="userId"
        autocomplete="username"
        placeholder="請輸入使用者代碼"
      />
      @if (form.controls.userId.invalid && form.controls.userId.touched) {
        <small class="error">請輸入使用者代碼。</small>
      }
    </div>

    <div class="field">
      <label for="password">密碼</label>
      <p-password
        inputId="password"
        formControlName="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        placeholder="請輸入密碼"
        styleClass="login-password"
      />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <small class="error">請輸入密碼。</small>
      }
    </div>

    <p-button
      type="submit"
      label="登入"
      icon="pi pi-sign-in"
      styleClass="login-submit"
      [loading]="submitting()"
    />
  </form>
</div>
