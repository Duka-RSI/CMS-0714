<div class="page">
  <!-- Header -->
  <div class="page-header">
    <div class="title-block">
      <h1 class="title">發布狀態 PublishStatus</h1>
      <span class="subtitle">內容發布狀態</span>
    </div>
    <div class="actions">
      <p-button
        label="搜尋條件"
        [icon]="isFiltered() ? 'pi pi-filter-fill' : 'pi pi-filter'"
        [severity]="isFiltered() ? 'info' : 'secondary'"
        [outlined]="!isFiltered()"
        [badge]="isFiltered() ? activeFilterCount().toString() : undefined"
        badgeSeverity="contrast"
        (onClick)="openFilter()"
      />
      <p-button label="新增" icon="pi pi-plus" severity="success" (onClick)="goAdd()" />
    </div>
  </div>

  <!-- Filtered indicator -->
  @if (isFiltered()) {
    <div class="filter-banner">
      <i class="pi pi-filter-fill"></i>
      <span class="filter-banner-label">已套用篩選條件：</span>
      <span class="chips">
        @for (chip of appliedFilters(); track chip.label) {
          <span class="chip">{{ chip.label }}：<b>{{ chip.value }}</b></span>
        }
      </span>
      <p-button
        label="清除篩選"
        icon="pi pi-times"
        severity="secondary"
        [text]="true"
        size="small"
        (onClick)="clearFilter()"
      />
    </div>
  }

  <!-- Table -->
  <div class="card" [class.card-filtered]="isFiltered()">
    <p-table
      [value]="statuses()"
      [loading]="loading()"
      [paginator]="true"
      [rows]="rows"
      [(first)]="first"
      [rowsPerPageOptions]="[10, 20, 50]"
      [sortField]="sortField"
      [sortOrder]="sortOrder"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
      dataKey="pkid"
      (onSort)="onSort($event)"
      (onPage)="onPage($event)"
      styleClass="p-datatable-sm p-datatable-gridlines"
    >
      <ng-template #header>
        <tr>
          <th pSortableColumn="pkid" style="width: 6rem">主代碼 <p-sortIcon field="pkid" /></th>
          <th pSortableColumn="description">狀態說明 <p-sortIcon field="description" /></th>
          <th pSortableColumn="isDraft" style="width: 8rem" class="text-center">
            草稿 <p-sortIcon field="isDraft" />
          </th>
          <th pSortableColumn="isPublished" style="width: 8rem" class="text-center">
            已發布 <p-sortIcon field="isPublished" />
          </th>
          <th pSortableColumn="isDiscontinued" style="width: 8rem" class="text-center">
            已停用 <p-sortIcon field="isDiscontinued" />
          </th>
          <th style="width: 9rem" class="text-center">操作</th>
        </tr>
      </ng-template>

      <ng-template #body let-status>
        <tr>
          <td>{{ status.pkid }}</td>
          <td>
            <a class="link" (click)="goView(status)">{{ status.description }}</a>
          </td>
          <td class="text-center">
            <p-tag
              [value]="status.isDraft ? '是' : '否'"
              [severity]="status.isDraft ? 'info' : 'secondary'"
            />
          </td>
          <td class="text-center">
            <p-tag
              [value]="status.isPublished ? '是' : '否'"
              [severity]="status.isPublished ? 'success' : 'secondary'"
            />
          </td>
          <td class="text-center">
            <p-tag
              [value]="status.isDiscontinued ? '是' : '否'"
              [severity]="status.isDiscontinued ? 'danger' : 'secondary'"
            />
          </td>
          <td class="text-center">
            <p-button
              icon="pi pi-eye"
              severity="secondary"
              [text]="true"
              [rounded]="true"
              pTooltip="檢視"
              (onClick)="goView(status)"
            />
            <p-button
              icon="pi pi-pencil"
              severity="info"
              [text]="true"
              [rounded]="true"
              pTooltip="編輯"
              (onClick)="goEdit(status)"
            />
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [text]="true"
              [rounded]="true"
              pTooltip="刪除"
              (onClick)="confirmDelete(status)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="6" class="text-center empty">查無資料</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>

<!-- Filter drawer -->
<p-drawer [(visible)]="filterVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="filter-body">
    <div class="field">
      <label for="keyword">關鍵字</label>
      <input
        id="keyword"
        type="text"
        pInputText
        [(ngModel)]="filters.keyword"
        placeholder="狀態說明"
        (keyup.enter)="applyFilter()"
      />
    </div>
    <div class="field">
      <label for="isDraft">草稿</label>
      <p-select
        inputId="isDraft"
        [(ngModel)]="filters.isDraft"
        [options]="boolOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="不限"
        [showClear]="true"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label for="isPublished">已發布</label>
      <p-select
        inputId="isPublished"
        [(ngModel)]="filters.isPublished"
        [options]="boolOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="不限"
        [showClear]="true"
        appendTo="body"
      />
    </div>
    <div class="field">
      <label for="isDiscontinued">已停用</label>
      <p-select
        inputId="isDiscontinued"
        [(ngModel)]="filters.isDiscontinued"
        [options]="boolOptions"
        optionLabel="label"
        optionValue="value"
        placeholder="不限"
        [showClear]="true"
        appendTo="body"
      />
    </div>
  </div>
  <ng-template #footer>
    <div class="filter-footer">
      <p-button label="清除" severity="secondary" [outlined]="true" (onClick)="clearFilter()" />
      <p-button label="套用" icon="pi pi-search" (onClick)="applyFilter()" />
    </div>
  </ng-template>
</p-drawer>
