<div class="page">
  <div class="page-header">
    <h1 class="title">檢視課程群組</h1>
    <div class="actions">
      <p-button label="返回" icon="pi pi-arrow-left" severity="secondary" [outlined]="true" (onClick)="goBack()" />
      <p-button label="編輯" icon="pi pi-pencil" (onClick)="goEdit()" />
    </div>
  </div>

  @if (courseGroup(); as cg) {
    <div class="card">
      <h2 class="section-title">課程群組資料</h2>
      <dl class="detail-grid">
        <dt>主代碼</dt>
        <dd>{{ cg.pkid }}</dd>

        <dt>群組名稱</dt>
        <dd>{{ cg.description }}</dd>
      </dl>
    </div>
  } @else if (!loading()) {
    <div class="card empty">查無資料。</div>
  }
</div>
