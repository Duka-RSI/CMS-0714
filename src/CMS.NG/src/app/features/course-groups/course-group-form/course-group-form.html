<form [formGroup]="form" (ngSubmit)="save()" class="page">
  <div class="page-header">
    <h1 class="title">{{ isEdit() ? '編輯課程群組' : '新增課程群組' }}</h1>
    <div class="actions">
      @if (isEdit()) {
        <app-row-audit-badge tableName="CourseGroup" [pkid]="pkid() ?? 0" />
      }
      <p-button
        type="button"
        label="取消"
        icon="pi pi-times"
        severity="secondary"
        [outlined]="true"
        (onClick)="cancel()"
      />
      <p-button
        type="submit"
        label="儲存"
        icon="pi pi-check"
        severity="success"
        [loading]="saving()"
      />
    </div>
  </div>

  <div class="card">
    <h2 class="section-title">群組資料</h2>

    @if (isEdit()) {
      <div class="field">
        <label>主代碼</label>
        <div class="readonly-value">{{ pkid() }}</div>
      </div>
    }

    <div class="field">
      <label for="description">群組名稱 <span class="text-required">*</span></label>
      <input
        id="description"
        type="text"
        pInputText
        formControlName="description"
        placeholder="請輸入群組名稱"
        maxlength="100"
        [class.ng-invalid-touched]="form.controls.description.invalid && form.controls.description.touched"
      />
      @if (form.controls.description.invalid && form.controls.description.touched) {
        <small class="error">請輸入群組名稱。</small>
      }
    </div>
  </div>
</form>
